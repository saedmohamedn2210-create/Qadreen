description = "إضافة متقدمة مصممة لخدمة مجتمع قادرين وتسهيل مهام المشرفين والمستفيدين. تتيح الإضافة إدارة وتنظيم الروابط بسرعة وكفاءة عالية عبر الاختصار الأصلي Insert+Ctrl+H، بالإضافة إلى الميزة الجديدة لنسخ أي رابط وضغط الاختصار Insert+Shift+C لفتح نافذة تفاعلية تتيح للمستخدم إضافة وبرمجة البرامج والروابط مباشرة على وضع التصميم."
