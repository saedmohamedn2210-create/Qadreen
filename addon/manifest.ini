name = Qadreen
summary = "قادرين: الإدارة السحابية المتقدمة للروابط والبرامج"
description = "إضافة متقدمة مصممة لخدمة مجتمع 'قادرين'، تهدف إلى تسهيل إدارة وتنظيم الروابط للمشرفين والمستفيدين بكفاءة عالية. تتميز الإضافة بنظام مزامنة سحابي آمن (Cloud Sync). تتيح للمستفيدين تصفح المحتوى والوصول السريع عبر الاختصار (NVDA+Control+H). كما تدعم 'وضع التصميم السحابي' الذي يتيح للمشرفين نسخ أي رابط وبرمجته مباشرة في المستودع المركزي عبر نافذة تفاعلية قياسية باستخدام الاختصار (NVDA+Shift+C)."
author = "Saeed Mohamed Atia <saedmohamed.n2210@gmail.com>"
url = https://github.com/saedmohamedn2210-create/Qadreen
