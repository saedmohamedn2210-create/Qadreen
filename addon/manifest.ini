name = Qadreen
summary = "قادرين: الإدارة السحابية المتقدمة والمزامنة المركزية للبرامج"
description = """إضافة متقدمة مصممة لمجتمع 'قادرين'، تتيح إدارة وتنظيم البرامج والروابط عبر محرك مزامنة سحابي ذري غير معطل للواجهة، مع معالجة تلقائية للتعارضات وحماية كاملة للبيانات المعلقة عند إعادة التشغيل.
تتميز الإضافة بتشفير آمن لبيانات المصادقة عبر تقنية Windows DPAPI، وتوفر زراً للمزامنة اللحظية المباشرة مع مستودع GitHub لمالك المستودع في 'وضع التصميم السحابي المركزي'.
تتيح للمستفيدين التصفح السريع والبحث الشامل عبر (NVDA+Control+H)، وبرمجة الروابط للمشرفين عبر (NVDA+Shift+C)، والتبديل لوضع التصميم السحابي عبر (NVDA+Control+Shift+D)."""
author = "Saeed Mohamed Atia <saedmohamed.n2210@gmail.com>"
url = https://github.com/saedmohamedn2210-create/Qadreen
